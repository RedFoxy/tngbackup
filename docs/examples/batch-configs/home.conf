#
# TNGBackup batch config - USER HOME DIRECTORIES
#
# This file is meant to live in a BATCH CONFIG DIRECTORY, e.g.
# /etc/tngbackup/home.conf, and to be processed together with its siblings:
#
#     tngbackup backup --config /etc/tngbackup/ \
#         --log /var/log/tngbackup.log --audit-log /var/log/tngbackup-audit.log
#
# Batch mode resets REPO_URI, REPO_PASSPHRASE, BACKUP_PATH, BACKUP_EXCLUDE and
# ARCHIVE_NAME between files. Everything else - BORG_OPT, all six KEEP_* rules,
# RESTORE_PATH, MOUNT_PATH, SSH_OPT, SSH_PORT - carries over from the
# previously processed config, so this file sets every variable explicitly.
# Configs are processed alphabetically, so anything this file leaves behind
# lands in webserver.conf next.
#
# Run this job as root: /home contains files owned by many users, and only
# root can read all of them and restore their ownership and modes intact.
#
# Install with mode 0600, owned by root, in a 0700 directory.
#

# --- Repository ---------------------------------------------------------------

# Local repository on a separate backup disk. Home directories are large and
# users ask for restores often, so keeping this one local makes recovery fast.
# Pair it with an off-site copy of the same data if /home is irreplaceable.
REPO_URI="/mnt/backup/borg/home"

REPO_PASSPHRASE='change-me-home-passphrase'

BORG_ENCRYPTION="repokey-blake2"

# --- What to back up ----------------------------------------------------------

# All user home directories. SPACE-separated.
BACKUP_PATH="/home"

# SEMICOLON-separated exclusions.
#
# Home directories are the worst offenders for regenerable churn: browser
# caches, package manager caches, build output and virtualenvs can easily be
# most of the bytes and nearly all of the daily change. Excluding them makes
# backups dramatically faster and smaller, and loses nothing that cannot be
# recreated.
#
# Covered below:
#   - XDG and application caches (~/.cache, ~/.local/share/Trash)
#   - browser caches and profile blobs
#   - JavaScript / Python / Rust / Java build and dependency trees
#   - Git object stores of checked-out clones (recloneable from the remote)
#   - cloud-sync local caches
#   - editor and shell scratch files
#   - sockets, pipes and lock files, which cannot be archived meaningfully
BACKUP_EXCLUDE="/home/*/.cache;/home/*/.local/share/Trash;/home/*/.local/share/Steam;/home/*/.thumbnails;/home/*/.mozilla/firefox/*/cache2;/home/*/.config/google-chrome/*/Cache;/home/*/.config/chromium/*/Cache;/home/*/snap/*/common/.cache;/home/*/.npm;/home/*/.yarn/cache;/home/*/.pnpm-store;/home/*/.cargo/registry;/home/*/.rustup/toolchains;/home/*/.gradle/caches;/home/*/.m2/repository;/home/*/.nix-defexpr;*/node_modules;*/.venv;*/venv;*/__pycache__;*/.tox;*/.mypy_cache;*/.pytest_cache;*/target/debug;*/build;*/dist;*/.git/objects;/home/*/Dropbox/.dropbox.cache;/home/*/.local/share/baloo;*.pyc;*.swp;*.swo;*~;*.tmp;*.part;*.sock;*.pid"

# Empty: unique archive-YYYYmmdd-HHMMSS per run.
ARCHIVE_NAME=""

# Scratch destination for `extract`. Restore here, inspect, then copy the
# wanted files back with correct ownership - never extract straight over /home.
RESTORE_PATH="/tmp/restore/home"

# Mount point for `mount`. Browsing a mounted archive is usually the quickest
# way to serve a "I deleted a file yesterday" request.
MOUNT_PATH="/mnt/borg"

# --- Borg options -------------------------------------------------------------

# Documents and source code compress well; --exclude-caches picks up any
# directory the application itself tagged with CACHEDIR.TAG, catching caches
# the pattern list above missed.
BORG_OPT="--compression zstd,10 --stats --exclude-caches --one-file-system"

# --- SSH (unused for a local repository, set explicitly for batch hygiene) -----
#
# REPO_URI is a local path, so the script unsets BORG_RSH and these are ignored
# for THIS job. They are still set to the script's DEFAULT values rather than
# left empty, because SSH_OPT and SSH_PORT are not reset between batch configs:
# an empty SSH_OPT here would silently strip BatchMode=yes from the next
# ssh:// job in the directory and hang it on a password prompt.

SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"
SSH_PORT="22"

# --- Retention ----------------------------------------------------------------
#
# Long retention. A user typically discovers a lost file weeks or months after
# the fact, and deduplication makes slow-changing personal data cheap to keep.
# Rules overlap rather than add up; this keeps roughly 30 archives spanning
# about two years.
#
# All six are stated explicitly: KEEP_* is NOT reset between batch configs, and
# the script's defaults are non-empty - omitting a rule inherits a policy
# rather than disabling it. Confirm the effective policy with
#   DEBUG=y DRYRUN=y tngbackup prune --config /etc/tngbackup/
# then check what Borg would delete with `borg prune --list --dry-run ...`.

KEEP_LAST="5"
KEEP_HOURLY=""
KEEP_DAILY="14"
KEEP_WEEKLY="8"
KEEP_MONTHLY="12"
KEEP_YEARLY="2"

# --- Output and logging -------------------------------------------------------

DEBUG="n"
DRYRUN="n"
SHOWTEXT="y"
LOG_FILE="/var/log/tngbackup.log"
AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"
