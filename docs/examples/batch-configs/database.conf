#
# TNGBackup batch config - DATABASE DUMPS
#
# This file is meant to live in a BATCH CONFIG DIRECTORY, e.g.
# /etc/tngbackup/database.conf, and to be processed together with its siblings:
#
#     tngbackup backup --config /etc/tngbackup/ \
#         --log /var/log/tngbackup.log --audit-log /var/log/tngbackup-audit.log
#
# Batch mode resets REPO_URI, REPO_PASSPHRASE, BACKUP_PATH, BACKUP_EXCLUDE and
# ARCHIVE_NAME between files. Everything else - notably BORG_OPT and all six
# KEEP_* rules - carries over from the previously processed config, so this
# file sets every variable explicitly, including the empty ones. That matters
# most here: the short retention below must not leak into the next job, and the
# next job's long retention must not leak into this one.
#
# IMPORTANT: this config archives DUMPS, not the live data directory.
# Copying /var/lib/mysql while the server is running produces a corrupt,
# unrestorable backup. Generate a consistent dump first, for example from
# cron shortly before the backup window:
#
#   mysqldump --single-transaction --quick --routines --triggers \
#             --all-databases | gzip > /var/backups/mysql/all-$(date +\%F).sql.gz
#
#   # PostgreSQL equivalent:
#   pg_dumpall | gzip > /var/backups/postgres/all-$(date +\%F).sql.gz
#
# Install with mode 0600, owned by root, in a 0700 directory. The dump
# directory itself should also be 0700 - it contains all of your data in
# plaintext until Borg encrypts it.
#

# --- Repository ---------------------------------------------------------------

# Dedicated repository so the short database retention below cannot affect the
# other jobs in the batch.
REPO_URI="ssh://borg@backup.example.com:22/srv/borg/database"

REPO_PASSPHRASE='change-me-database-passphrase'

BORG_ENCRYPTION="repokey-blake2"

# --- What to back up ----------------------------------------------------------

# The dump directories only. SPACE-separated.
BACKUP_PATH="/var/backups/mysql /var/backups/postgres"

# SEMICOLON-separated exclusions. Skip partial dumps from an interrupted or
# still-running dump job - an incomplete .sql is worse than useless, because it
# restores silently and wrongly.
BACKUP_EXCLUDE="*.tmp;*.part;*.partial;*.inprogress;*/lost+found"

# Empty: unique archive-YYYYmmdd-HHMMSS per run.
ARCHIVE_NAME=""

RESTORE_PATH="/tmp/restore/database"
MOUNT_PATH="/mnt/borg"

# --- Borg options -------------------------------------------------------------

# The dumps are already gzipped, so heavy compression would burn CPU for
# nothing: lz4 is the right choice. Deduplication still works well across
# consecutive dumps.
# If you store dumps UNCOMPRESSED instead (plain .sql), switch to
# "--compression zstd,10" - Borg will compress and deduplicate far better than
# gzip does, because gzip's output changes wholesale on every run.
BORG_OPT="--compression lz4 --stats --one-file-system --checkpoint-interval 900"

# --- SSH ----------------------------------------------------------------------
#
# REPO_URI is an ssh:// URI, so the script exports
# BORG_RSH="ssh $SSH_OPT -p $SSH_PORT" automatically. No manual export needed.
# Setting SSH_OPT replaces the built-in default wholesale, so the defaults are
# repeated here alongside an explicit identity file and a keepalive.

SSH_PORT="22"
SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -o ServerAliveInterval=30 -i /root/.ssh/borg_ed25519"

# --- Retention ----------------------------------------------------------------
#
# SHORT retention, deliberately.
#
# Database dumps are large and dense: each one is mostly new data from Borg's
# point of view, so they deduplicate far worse than a filesystem tree. A long
# tail of dumps grows the repository quickly.
#
# Bad data in a database is also normally detected fast (hours, not months),
# so recovery value is concentrated in the recent past. If you have a legal
# obligation to keep older data, satisfy it with periodic exports to cold
# storage rather than by extending this policy.
#
# Roughly 12 archives kept: one day of hourly points if you dump hourly,
# a week of daily points, a month of weekly points.
#
# All six are stated explicitly: KEEP_* is NOT reset between batch configs, and
# the script's own defaults are non-empty (KEEP_LAST=10, KEEP_DAILY=7,
# KEEP_WEEKLY=4, KEEP_MONTHLY=12) - omitting a rule inherits a policy rather
# than disabling it. "0" and "" both disable a rule; setting all six to 0 makes
# `prune` refuse to run rather than pruning everything.

KEEP_LAST="2"
KEEP_HOURLY="6"
KEEP_DAILY="7"
KEEP_WEEKLY="4"
KEEP_MONTHLY=""
KEEP_YEARLY=""

# --- Output and logging -------------------------------------------------------

DEBUG="n"
DRYRUN="n"
SHOWTEXT="y"
LOG_FILE="/var/log/tngbackup.log"
AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"
