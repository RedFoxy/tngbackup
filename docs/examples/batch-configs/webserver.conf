#
# TNGBackup batch config - WEBSERVER
#
# This file is meant to live in a BATCH CONFIG DIRECTORY, e.g.
# /etc/tngbackup/webserver.conf, and to be processed together with its
# siblings by:
#
#     tngbackup backup --config /etc/tngbackup/ \
#         --log /var/log/tngbackup.log --audit-log /var/log/tngbackup-audit.log
#
# Batch mode resets REPO_URI, REPO_PASSPHRASE, BACKUP_PATH, BACKUP_EXCLUDE and
# ARCHIVE_NAME between files. Everything else - BORG_OPT, all six KEEP_*
# rules, RESTORE_PATH, MOUNT_PATH, SSH_OPT, SSH_PORT - carries over from the
# previously processed config, so this file sets ALL of them explicitly.
# An inherited retention rule is a silent data-retention bug.
#
# The batch runs to completion even if one config fails, and tngbackup exits
# non-zero if any of them did, so cron and systemd report failures normally.
#
# Validate the whole directory before it runs unattended:
#     DRYRUN=y tngbackup backup --config /etc/tngbackup/
#
# Install with mode 0600, owned by root, in a 0700 directory.
#

# --- Repository ---------------------------------------------------------------

# Dedicated repository for the web content. One repository per job keeps
# retention policies independent and makes prune safe.
REPO_URI="ssh://borg@backup.example.com:22/srv/borg/webserver"

# Encryption passphrase. Single-quoted so $, ` and \ are taken literally.
REPO_PASSPHRASE='change-me-webserver-passphrase'

# Used only by `tngbackup init`.
BORG_ENCRYPTION="repokey-blake2"

# --- What to back up ----------------------------------------------------------

# Document roots plus the web server configuration, so a rebuilt host can be
# restored to a serving state, not just to a pile of files.
# SPACE-separated.
BACKUP_PATH="/var/www /etc/nginx /etc/letsencrypt"

# SEMICOLON-separated exclusions. Web trees are full of regenerable churn;
# excluding it keeps archives small and the nightly transfer short.
#   - framework caches (Laravel, Symfony, WordPress, Composer, npm)
#   - access/error logs, which change constantly and are archived elsewhere
#   - session and upload temp files
#   - VCS object stores
BACKUP_EXCLUDE="/var/www/*/storage/framework/cache;/var/www/*/storage/framework/sessions;/var/www/*/storage/logs;/var/www/*/var/cache;/var/www/*/var/log;/var/www/*/wp-content/cache;/var/www/*/cache;/var/www/*/tmp;*/node_modules;*/vendor/composer/tmp;*/.git/objects;*.log;*/logs/*.log;*.sock;*.pid"

# Empty: let each run get a unique archive-YYYYmmdd-HHMMSS name.
# Batch mode resets ARCHIVE_NAME between configs, so this is stated for
# clarity rather than as a workaround.
ARCHIVE_NAME=""

# Scratch destination for `extract`. Never restore straight over /var/www.
RESTORE_PATH="/tmp/restore/webserver"

# Mount point for `mount`. Must exist and be empty.
MOUNT_PATH="/mnt/borg"

# --- Borg options -------------------------------------------------------------

# Text-heavy content compresses well, so zstd earns its CPU here.
BORG_OPT="--compression zstd,10 --stats --exclude-caches --one-file-system --checkpoint-interval 900"

# --- SSH ----------------------------------------------------------------------
#
# REPO_URI is an ssh:// URI, so the script exports
# BORG_RSH="ssh $SSH_OPT -p $SSH_PORT" automatically before each Borg call.
# No manual BORG_RSH export is needed.
#
# Setting SSH_OPT replaces the built-in default wholesale, so the three options
# that matter for unattended runs are repeated here, plus an explicit identity
# file (root has no ssh-agent under cron/systemd) and a keepalive.

SSH_PORT="22"
SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -o ServerAliveInterval=30 -i /root/.ssh/borg_ed25519"

# --- Retention ----------------------------------------------------------------
#
# Web content changes in bursts (a deploy) and mistakes are usually noticed
# within a day or two, but a defaced or compromised site may go unnoticed for
# weeks - hence a reasonably long tail.
# Rules overlap rather than add up; this keeps roughly 20 archives.
# A rule counts only when non-empty and not "0". All six are stated because
# KEEP_* is NOT reset between batch configs.
# Confirm with: DEBUG=y DRYRUN=y tngbackup prune --config /etc/tngbackup/

KEEP_LAST="3"
KEEP_HOURLY=""
KEEP_DAILY="14"
KEEP_WEEKLY="4"
KEEP_MONTHLY="6"
KEEP_YEARLY="1"

# --- Output and logging -------------------------------------------------------

DEBUG="n"
DRYRUN="n"
SHOWTEXT="y"
LOG_FILE="/var/log/tngbackup.log"
AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"
