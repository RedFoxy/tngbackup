#
# TNGBackup v2 — Example Configuration File
#
# This file demonstrates all available configuration options for TNGBackup.
# Copy and adapt this file to your needs.
#
# Configuration Priority (highest to lowest):
# 1. CLI Arguments (--repo, --passphrase, etc.)
# 2. Environment Variables (TNGB_* prefix)
# 3. This Configuration File
# 4. Default values (hardcoded in script)
#

# ==============================================================================
# REPOSITORY CONFIGURATION (REQUIRED)
# ==============================================================================

# Repository URI
# Local path example: /mnt/backup/borg-repo
# SSH example:       ssh://user@backup.example.com:22/mnt/repos/borg-repo
# SSH with key:      ssh://user@backup.example.com/mnt/repos/borg-repo (uses .ssh/id_rsa)
#
REPO_URI="/mnt/backup/borg-repo"

# Repository passphrase (REQUIRED for encrypted repos)
# This passphrase is used to encrypt/decrypt the backup repository
# WARNING: Store this securely; never commit plaintext passwords to version control
#
REPO_PASSPHRASE="your-secure-passphrase-here"

# ==============================================================================
# BACKUP CONFIGURATION
# ==============================================================================

# Paths to backup (space-separated list)
# Example: "/home /etc /var/www"
#
BACKUP_PATH="/home /etc"

# Archive name template (optional, uses default if not specified)
# Default: {hostname}-{now:%Y%m%d-%H%M%S}
#
# ARCHIVE_NAME="production-{now:%Y%m%d-%H%M%S}"

# Restore destination path (used by extract/restore operations)
# Example: /tmp/restore
#
# RESTORE_PATH="/tmp/restore"

# Mount point for mount operations (optional)
# Example: /mnt/borg-mount
#
# MOUNT_PATH="/mnt/borg-mount"

# ==============================================================================
# BACKUP HOOKS (Pre/Post Execution)
# ==============================================================================

# PRERUN: Script/command to execute BEFORE backup (optional)
# Useful for: database dumps, snapshots, pre-backup validation
# If PRERUN fails (exit code != 0), the backup is aborted
# Examples:
#   PRERUN="/path/to/dump-database.sh"
#   PRERUN="docker exec mydb mysqldump -u root -p$MYSQL_PASS --all-databases > /tmp/backup.sql"
#
# PRERUN=""

# POSTRUN: Script/command to execute AFTER backup (optional)
# Useful for: cleanup, notifications, archiving, backup verification
# POSTRUN is executed regardless of backup success or failure
# POSTRUN failure does not affect backup operation status
# Examples:
#   POSTRUN="rm -f /tmp/backup.sql"
#   POSTRUN="curl -X POST https://alerts.example.com/backup-done"
#
# POSTRUN=""

# Companion Operations (before/after backup)

# CHECK_BACKUP: Repository integrity check around backup (optional)
# Values: 0=disabled (default), 1=before backup, 2=after backup
#
# CHECK_BACKUP="0"

# PRUNE_BACKUP: Remove old archives according to retention policy around backup (optional)
# Values: 0=disabled (default), 1=before backup, 2=after backup
#
# PRUNE_BACKUP="0"

# COMPACT_BACKUP: Reclaim disk space around backup (optional)
# Values: 0=disabled (default), 1=before backup, 2=after backup
#
# COMPACT_BACKUP="0"

# Repository Auto-Creation (for new backup repositories)

# CREATE_REPO: Automatically initialize repository if it doesn't exist (optional)
# When enabled and repository is missing, tngbackup init is called automatically
# Values: y/n (default: y)
#
# CREATE_REPO="y"

# CREATE_REPO_DIR: Automatically create repository parent directory if missing (optional)
# Works only for local repositories; remote repositories require pre-existing parent
# Values: y/n (default: y)
#
# CREATE_REPO_DIR="y"

# ==============================================================================
# BORG ENCRYPTION & OPTIONS
# ==============================================================================

# Borg encryption method (default: repokey-blake2)
# Options: none, keyfile, keyfile-blake2, repokey, repokey-blake2
#
BORG_ENCRYPTION="repokey-blake2"

# Extra Borg options (optional)
# Examples:
#   BORG_OPT="--compression zstd,10"
#   BORG_OPT="--compression lz4 --checkpoint-interval 3600"
#
# BORG_OPT="--compression zstd,10"

# ==============================================================================
# SSH CONFIGURATION (for remote repositories)
# ==============================================================================

# SSH options (used when REPO_URI points to a remote server)
# Examples:
#   "-o BatchMode=yes"
#   "-o StrictHostKeyChecking=accept-new"
#   "-o ConnectTimeout=5"
#   "-o IdentityFile=/home/user/.ssh/backup_key"
#
SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"

# SSH port (default: 22)
#
SSH_PORT="22"

# SSH password for interactive authentication (optional, less secure)
# Only used when SSH_PASSWORD is set; requires 'sshpass' utility
# WARNING: Storing passwords in config files is less secure than using SSH keys
# Preferred method: use SSH key-based authentication (IdentityFile in SSH_OPT)
# Example: SSH_PASSWORD="your-ssh-password-here"
#
# SSH_PASSWORD=""

# ==============================================================================
# RETENTION POLICY (Pruning)
# ==============================================================================

# Keep the last N archives
# Example: KEEP_LAST=3
#
# KEEP_LAST="3"

# Keep N hourly archives
# Example: KEEP_HOURLY=24
#
# KEEP_HOURLY="24"

# Keep N daily archives
# Example: KEEP_DAILY=7
#
KEEP_DAILY="7"

# Keep N weekly archives
# Example: KEEP_WEEKLY=4
#
KEEP_WEEKLY="4"

# Keep N monthly archives
# Example: KEEP_MONTHLY=12
#
KEEP_MONTHLY="12"

# Keep N yearly archives
# Example: KEEP_YEARLY=2
#
KEEP_YEARLY="2"

# ==============================================================================
# OUTPUT & DEBUG
# ==============================================================================

# Enable debug output (y/n)
# When enabled, script prints detailed diagnostic information
#
DEBUG="n"

# Show text output (y/n)
# When enabled, script displays informational messages during operations
#
SHOWTEXT="y"

# ==============================================================================
# LOGGING (Optional)
# ==============================================================================

# Log file path (optional)
# If specified, operations are logged to this file
# Example: /var/log/tngbackup.log
#
# LOG_FILE="/var/log/tngbackup.log"

# Audit log file path (optional)
# If specified, security and credential events are logged separately
# Example: /var/log/tngbackup-audit.log
#
# AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"

# ==============================================================================
# ADVANCED OPTIONS
# ==============================================================================

# Auto-clear Borg cache before operations (optional)
# When enabled, clears the Borg cache to recover disk space
# Values: y/n
#
# CLEAR_CACHE="n"
