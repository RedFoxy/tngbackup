#
# TNGBackup - Example configuration: REMOTE (SSH) repository
#
# Backs up /home, /etc and /var/www to a Borg repository on a backup server
# reached over SSH.
#
# Prerequisites on the SERVER:
#   1. Borg is installed and reachable from a non-interactive shell.
#   2. The parent directory of the repository exists and is writable by the
#      SSH user.
#   3. The client's public key is in the SSH user's authorized_keys.
#
# Prerequisites on the CLIENT (this machine):
#   - Key-based, non-interactive SSH must work as the user that will run the
#     backup (usually root, for cron/systemd):
#         sudo ssh -o BatchMode=yes -o ConnectTimeout=5 -p 22 \
#              borg@backup.example.com borg --version
#     If that prompts for anything, fix it BEFORE scheduling a backup - an
#     SSH prompt in cron means the job hangs forever.
#
# Install as:
#     sudo install -m 0600 -o root -g root remote-backup.conf /etc/tngbackup.conf
#     tngbackup init   --config /etc/tngbackup.conf     # once
#     tngbackup backup --config /etc/tngbackup.conf
#
# This file is SOURCED as Bash. Keep it mode 0600, owned by root.
#

# ==============================================================================
# REPOSITORY
# ==============================================================================

# REPO_URI (required)
#   SSH repository URI. Accepted forms:
#     ssh://user@host:port/absolute/path/to/repo
#     ssh://user@host/absolute/path/to/repo        (port 22)
#     ssh://user@host/./relative/to/home           ( ./ = the SSH user's $HOME )
#   The port in the URI is what Borg actually dials; SSH_PORT below exists so
#   the same value can be reused when building BORG_RSH.
REPO_URI="ssh://borg@backup.example.com:22/srv/borg/$(hostname -s)"

# REPO_PASSPHRASE (required)
#   Encryption passphrase for the repository. SINGLE quotes prevent Bash from
#   expanding $, ` and \ inside it.
#   The passphrase never travels to the server in plaintext - encryption and
#   decryption happen here, client-side. The server only ever sees encrypted
#   chunks.
#   Store a copy off this machine. Without it the backups are unrecoverable.
REPO_PASSPHRASE='change-me-to-a-long-random-passphrase'

# BORG_ENCRYPTION (optional, default: repokey-blake2)
#   Used only by `tngbackup init`. repokey-blake2 keeps the key inside the
#   repository, protected by the passphrase - convenient, and it means the
#   client keeps no key file of its own. Export a copy anyway:
#     borg key export ssh://borg@backup.example.com:22/srv/borg/host /root/borg.key
BORG_ENCRYPTION="repokey-blake2"

# ==============================================================================
# WHAT TO BACK UP
# ==============================================================================

# BACKUP_PATH (required for `backup`) - SPACE-separated.
BACKUP_PATH="/home /etc /var/www"

# BACKUP_EXCLUDE (optional) - SEMICOLON-separated (different separator!).
#   Over a network link, excluding churn-heavy junk matters more than it does
#   locally: every new chunk costs bandwidth.
BACKUP_EXCLUDE="*.tmp;*.swp;*/.cache;*/Cache;*/node_modules;*/.git/objects;/var/www/*/cache;/home/*/.local/share/Trash"

# ARCHIVE_NAME (optional)
#   Empty = auto-generated archive-YYYYmmdd-HHMMSS. Prefer this; a fixed name
#   makes the next run fail with "Archive already exists".
ARCHIVE_NAME=""

# RESTORE_PATH (optional) - destination for `tngbackup extract`.
#   Restore into a scratch directory and inspect before moving files into place.
RESTORE_PATH="/tmp/restore"

# MOUNT_PATH (optional) - mount point for `tngbackup mount`.
#   Mounting a remote repository works, but every read is a network round trip.
#   For bulk restores use `extract` instead.
MOUNT_PATH="/mnt/borg"

# ==============================================================================
# BORG OPTIONS
# ==============================================================================

# BORG_OPT (optional)
#   Extra options for `borg create`. Word-split - no embedded spaces.
#   --checkpoint-interval matters over the network: if a long transfer is
#   interrupted, the next run resumes from the last checkpoint instead of
#   starting over.
BORG_OPT="--compression zstd,10 --stats --exclude-caches --one-file-system --checkpoint-interval 900"

# ==============================================================================
# SSH CONFIGURATION
# ==============================================================================

# These two are wired up AUTOMATICALLY. Before every Borg call the script
# inspects REPO_URI and, when it starts with ssh://, exports:
#
#     BORG_RSH="ssh $SSH_OPT -p $SSH_PORT"
#
# For a local repository it unsets BORG_RSH instead, so a stale value can never
# leak in. You do NOT need to export BORG_RSH by hand.

# SSH_PORT (optional, default 22)
#   SSH port of the backup server. Keep it consistent with the port in
#   REPO_URI above.
SSH_PORT="22"

# SSH_OPT (optional)
#   SSH client options for the connection to the repository host.
#
#   The DEFAULT is already the right thing for unattended backups:
#       -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5
#   Setting SSH_OPT REPLACES that default wholesale, so repeat the options you
#   still want - as the value below does.
#     -o BatchMode=yes
#         Never prompt. If the key does not work, fail immediately instead of
#         hanging on a password prompt. This is the single most important
#         option for unattended backups.
#     -o StrictHostKeyChecking=accept-new
#         Trust the host key on first contact, then pin it. Reasonable for
#         automation. On an untrusted network, pre-seed known_hosts and use
#         StrictHostKeyChecking=yes instead:
#             ssh-keyscan -p 22 backup.example.com >> /root/.ssh/known_hosts
#     -o ConnectTimeout=5
#         Fail fast when the server is unreachable, rather than blocking the
#         whole backup window.
#     -o ServerAliveInterval=30 -o ServerAliveCountMax=6
#         Keep long transfers alive through NAT/firewall idle timeouts.
#     -i /root/.ssh/borg_ed25519
#         An EXPLICIT identity file. Name it here: under cron and systemd, root
#         has a different $HOME and no ssh-agent, so a key that works in your
#         interactive shell may not be found.
SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i /root/.ssh/borg_ed25519"

# Verify the wiring without touching the repository:
#     DEBUG=y DRYRUN=y tngbackup list --config /etc/tngbackup.conf
#     # [DEBUG] Remote repository detected, BORG_RSH configured
#
# If SSH_OPT seems to be ignored, check that REPO_URI really begins with
# "ssh://" - BORG_RSH is only configured for that URI scheme.

# BORG_REMOTE_PATH (optional)
#   Uncomment if `borg` is not on the server's non-interactive PATH.
# export BORG_REMOTE_PATH="/usr/local/bin/borg"

# ==============================================================================
# RETENTION POLICY (used by `tngbackup prune`)
# ==============================================================================
#
# Rules keep the newest archive per time bucket; the kept set is the UNION of
# all rules, so they overlap rather than add up. A rule counts only when its
# value is non-empty AND not "0".
#
# IMPORTANT: the script's defaults are NOT empty (KEEP_LAST=10, KEEP_DAILY=7,
# KEEP_WEEKLY=4, KEEP_MONTHLY=12), so a config that omits retention still has a
# policy that `prune` will act on. State all six explicitly, as below.
# Setting all six to 0 makes `prune` refuse to run - it never prunes everything.
#
# Confirm before trusting it:
#   DEBUG=y DRYRUN=y tngbackup prune --config /etc/tngbackup.conf
#   BORG_PASSPHRASE='...' borg prune --list --dry-run \
#       --keep-last=3 --keep-daily=7 --keep-weekly=4 --keep-monthly=12 \
#       --keep-yearly=2 ssh://borg@backup.example.com:22/srv/borg/host
#
# Pruning frees no space until `tngbackup compact` runs.
#
# NOTE: if the server restricts this key with `borg serve --append-only`
# (strongly recommended - it stops a compromised client from destroying the
# backup history), prune/delete/compact from here will not actually reclaim
# space. Compact on the server instead.

KEEP_LAST="3"
KEEP_HOURLY=""
KEEP_DAILY="7"
KEEP_WEEKLY="4"
KEEP_MONTHLY="12"
KEEP_YEARLY="2"

# ==============================================================================
# OUTPUT AND LOGGING
# ==============================================================================

# DEBUG (y/n) - detailed diagnostics, including the Borg command line, the
# retention policy and whether BORG_RSH was configured. Review before sharing.
DEBUG="n"

# DRYRUN (y/n) - log every Borg command as "[DRY-RUN] borg ..." and execute
# nothing. The quickest way to validate this file end to end:
#     DEBUG=y DRYRUN=y tngbackup backup --config /etc/tngbackup.conf
# A dry run always reports SUCCESS, so it proves what WOULD run - not that the
# server is reachable. Use a real `tngbackup list` for that.
DRYRUN="n"

# SHOWTEXT (y/n) - console output. Set "n" for quiet cron jobs that rely on
# LOG_FILE, so mail arrives only when something goes to stderr.
SHOWTEXT="y"

# LOG_FILE - human-readable log (Borg output is tee'd here too).
#   Create it with tight permissions if you set it here rather than via --log:
#     sudo install -m 0600 /dev/null /var/log/tngbackup.log
LOG_FILE="/var/log/tngbackup.log"

# AUDIT_LOG_FILE - one record per operation:
#   TIMESTAMP_UTC_ISO8601 | operation | status | details | duration_seconds
AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"
