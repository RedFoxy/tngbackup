#
# TNGBackup - Example configuration: LOCAL repository
#
# Backs up /home, /etc and /var/www into a Borg repository living on a
# locally mounted disk (an external USB drive, a second internal disk, or a
# dedicated backup volume).
#
# Install as:
#     sudo install -m 0600 -o root -g root local-backup.conf /etc/tngbackup.conf
#
# Then:
#     tngbackup init   --config /etc/tngbackup.conf     # once
#     tngbackup backup --config /etc/tngbackup.conf
#
# This file is SOURCED by the script, i.e. it is executed as Bash. Keep it
# mode 0600 and owned by root: anyone who can write it can run code as root,
# and anyone who can read it learns the repository passphrase.
#

# ==============================================================================
# REPOSITORY
# ==============================================================================

# REPO_URI (required)
#   Absolute path to the Borg repository directory. The PARENT directory must
#   already exist and be writable; the repository directory itself is created
#   by `tngbackup init`.
#   Do not put the repository on the same physical disk as the data it
#   protects - a disk failure would take both.
REPO_URI="/mnt/backup/borg-repo"

# REPO_PASSPHRASE (required)
#   Passphrase protecting the repository encryption key. Exported to Borg as
#   BORG_PASSPHRASE for the duration of the run.
#   NOTE the SINGLE quotes: they stop Bash from expanding $, ` and \ inside the
#   passphrase. Losing this string means losing the backups permanently -
#   store a copy in a password manager, off this machine.
REPO_PASSPHRASE='change-me-to-a-long-random-passphrase'

# BORG_ENCRYPTION (optional, default: repokey-blake2)
#   Encryption mode, used only by `tngbackup init`.
#     repokey-blake2  key stored in the repository, protected by the passphrase
#     keyfile-blake2  key stored in ~/.config/borg/keys - back that up too, or
#                     the repository becomes unreadable
#     none            no encryption (not recommended)
#   After init, export the key and keep it somewhere safe:
#     borg key export /mnt/backup/borg-repo /root/borg-repo.key
BORG_ENCRYPTION="repokey-blake2"

# ==============================================================================
# WHAT TO BACK UP
# ==============================================================================

# BACKUP_PATH (required for the `backup` operation)
#   SPACE-separated list of paths to archive. Paths containing spaces are not
#   supported, because the value is word-split into the Borg command line.
BACKUP_PATH="/home /etc /var/www"

# BACKUP_EXCLUDE (optional)
#   SEMICOLON-separated list of exclusion patterns - note the different
#   separator from BACKUP_PATH. Each item becomes one `--exclude` argument.
#   Patterns use Borg's default fnmatch style: * matches across separators,
#   a leading / anchors to the filesystem root.
BACKUP_EXCLUDE="*.tmp;*.swp;*/.cache;*/Cache;*/node_modules;*/.git/objects;/var/www/*/cache;/home/*/.local/share/Trash"

# ARCHIVE_NAME (optional)
#   Leave EMPTY so each run gets a unique, timestamped name of the form
#   archive-YYYYmmdd-HHMMSS. A fixed value makes the second backup fail with
#   "Archive already exists".
ARCHIVE_NAME=""

# RESTORE_PATH (optional)
#   Default destination directory for `tngbackup extract`. Files are written
#   relative to it, so an archive of /etc lands in /tmp/restore/etc.
#   Always restore into a scratch directory first, never over live data.
RESTORE_PATH="/tmp/restore"

# MOUNT_PATH (optional)
#   Mount point used by `tngbackup mount`. Must exist and be empty.
#     sudo mkdir -p /mnt/borg
MOUNT_PATH="/mnt/borg"

# ==============================================================================
# BORG OPTIONS
# ==============================================================================

# BORG_OPT (optional)
#   Extra options appended to `borg create`. Word-split, so no arguments with
#   embedded spaces.
#     --compression zstd,10   balanced ratio/speed (good default)
#     --compression lz4       fastest, for already-compressed data
#     --stats                 print a size summary when the archive is done
#     --exclude-caches        skip directories tagged with CACHEDIR.TAG
#     --one-file-system       do not descend into other mounted filesystems
#     --checkpoint-interval N resume-friendly checkpoints every N seconds
BORG_OPT="--compression zstd,10 --stats --exclude-caches --one-file-system"

# ==============================================================================
# SSH (not used for a local repository - kept for reference)
# ==============================================================================

# SSH_OPT / SSH_PORT only matter when REPO_URI is an ssh:// URI: the script
# then exports BORG_RSH="ssh $SSH_OPT -p $SSH_PORT" automatically. For a local
# repository BORG_RSH is explicitly unset instead, so these are ignored here.
#
# They are still stated at their default values, because in batch mode SSH_OPT
# and SSH_PORT are NOT reset between config files - leaving them out would let
# this file inherit whatever the previously processed config set.
SSH_OPT="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"
SSH_PORT="22"

# ==============================================================================
# RETENTION POLICY (used by `tngbackup prune`)
# ==============================================================================
#
# Each rule keeps the NEWEST archive in each time bucket. The kept set is the
# UNION of all rules, so the rules overlap rather than add up: the policy below
# keeps roughly 12-14 archives spanning about a year, not 7+4+6+1.
#
# A rule is applied only when its value is non-empty AND not "0"; both ""
# and "0" disable it.
#
# IMPORTANT: these variables have NON-EMPTY defaults in the script
# (KEEP_LAST=10, KEEP_DAILY=7, KEEP_WEEKLY=4, KEEP_MONTHLY=12). A config that
# says nothing about retention therefore still has a real policy that `prune`
# will act on. Always state all six explicitly, as below.
#
# Setting all six to 0 does NOT prune everything: `prune` refuses to run and
# reports a failure. That guard is deliberate.
#
# ALWAYS confirm a policy before trusting it. First what the script will pass:
#   DEBUG=y DRYRUN=y tngbackup prune --config /etc/tngbackup.conf
# then what Borg would actually delete:
#   BORG_PASSPHRASE='...' borg prune --list --dry-run \
#       --keep-last=3 --keep-daily=7 --keep-weekly=4 --keep-monthly=6 \
#       --keep-yearly=1 /mnt/backup/borg-repo
#
# Pruning does not free disk space by itself - run `tngbackup compact`
# afterwards.

# Keep the N most recent archives regardless of age (a safety floor).
KEEP_LAST="3"

# Keep the newest archive of each of the last N hours. Only useful for
# sub-daily backup schedules; empty here.
KEEP_HOURLY=""

# Keep the newest archive of each of the last N days - one week of daily
# recovery points.
KEEP_DAILY="7"

# Keep the newest archive of each of the last N weeks - one month of weekly
# recovery points.
KEEP_WEEKLY="4"

# Keep the newest archive of each of the last N months.
KEEP_MONTHLY="6"

# Keep the newest archive of each of the last N years.
KEEP_YEARLY="1"

# ==============================================================================
# OUTPUT AND LOGGING
# ==============================================================================

# DEBUG (y/n, default n)
#   Print [DEBUG] diagnostics: config loading, CLI parsing, the exact Borg
#   command line, the retention policy, cleanup steps.
#   Review the output before sharing it - it describes your repository layout.
DEBUG="n"

# DRYRUN (y/n, default n)
#   Log every Borg command as "[DRY-RUN] borg ..." and execute nothing.
#   Useful for validating this file before it runs unattended:
#     DEBUG=y DRYRUN=y tngbackup backup --config /etc/tngbackup.conf
#   Note a dry run always reports SUCCESS, because nothing ran - it proves what
#   WOULD be executed, not that the repository is reachable.
DRYRUN="n"

# SHOWTEXT (y/n, default y)
#   Print timestamped INFO/WARN/ERROR lines to the console. Set to "n" for
#   cron jobs that log to a file, so mail only arrives when something writes
#   to stderr.
SHOWTEXT="y"

# LOG_FILE (optional)
#   Human-readable log, appended to. Borg's own output is tee'd here too.
#   When set in a config file (rather than via --log) the script does not
#   create it, so create it yourself with tight permissions:
#     sudo install -m 0600 /dev/null /var/log/tngbackup.log
LOG_FILE="/var/log/tngbackup.log"

# AUDIT_LOG_FILE (optional)
#   One record per operation:
#     TIMESTAMP_UTC_ISO8601 | operation | status | details | duration_seconds
#   Small, and the evidence that backups actually ran - keep it for years and
#   rotate it far less aggressively than LOG_FILE.
AUDIT_LOG_FILE="/var/log/tngbackup-audit.log"
